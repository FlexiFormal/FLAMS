
[package]
name = "flams-router-base"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[features]
ssr = [
    #"ftml-components/ssr",
    "dep:flams-math-archives",
    "leptos/ssr",
    "thaw/ssr",
    "flams-database/backend",
    "flams-web-utils/ssr",
    "dep:flams-git",
    "dep:flams-system",
    "dep:axum-login",
    "dep:tokio",
    "dep:axum",
]
hydrate = [
    "leptos/hydrate",
    "thaw/hydrate",
    "flams-web-utils/hydrate",
    #"ftml-components/hydrate",
    "dep:bytes",
    "dep:http",
    "dep:futures",
    "dep:wasm-streams",
    "dep:wasm-bindgen-futures",
]
docs-only = []

[dependencies]
ftml-uris = { workspace = true, features = ["leptos"] }
ftml-ontology = { workspace = true, features = ["serde"] }
ftml-dom = {workspace = true}

flams-database = { workspace = true }
flams-git = { workspace = true, optional = true, features = ["gitlab"] }
flams-web-utils = { workspace = true }
flams-utils = { workspace = true }
flams-system = { workspace = true, optional = true, features = ["tokio"] }
flams-math-archives = { workspace = true, optional = true }

leptos = { workspace = true }
thaw = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
const-str = { workspace = true }
leptos_router = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
axum-login = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
icondata_tb = { workspace = true }
send_wrapper = { workspace = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
wasm-streams = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
