
[package]
name = "flams-router-buildqueue-base"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[features]
ssr = [
    "ftml-dom/ssr",
    "leptos/ssr",
    "thaw/ssr",
    "flams-router-base/ssr",
    "flams-web-utils/ssr",
    "dep:flams-system",
    "dep:flams-math-archives",
    "dep:tokio",
]
hydrate = [
    "ftml-dom/hydrate",
    "leptos/hydrate",
    "thaw/hydrate",
    "flams-web-utils/hydrate",
    "flams-router-base/hydrate",
]
docs-only = []

[dependencies]
ftml-ontology = { workspace = true, features = ["serde"] }
ftml-uris = { workspace = true }
flams-backend-types = { workspace = true, features = ["serde"] }
ftml-dom = { workspace = true }

flams-utils = { workspace = true }
flams-git = { workspace = true }
flams-web-utils = { workspace = true }
flams-router-base = { workspace = true }

flams-system = { workspace = true, optional = true, features = ["tokio"] }
flams-math-archives = { workspace = true, optional = true }

leptos = { workspace = true }
leptos_router = { workspace = true }
thaw = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
