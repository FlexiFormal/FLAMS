[package]
name = "flams-system"
version = "0.0.1"
edition = "2021"

[features]
rocksdb = ["flams-math-archives/rocksdb"]
tokio = ["dep:tokio", "flams-utils/tokio"]
gitlab = ["flams-git/gitlab", "tokio", "flams-math-archives/git"]
zip = [
    "tokio",
    "dep:reqwest",
    "dep:async-compression",
    "dep:astral-tokio-tar",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:futures",
] #["dep:flate2","dep:tar","tokio","dep:tokio-util","dep:reqwest","dep:async-compression"]
tantivy = []
vectorsearch = []

[dev-dependencies]
tracing-subscriber = { workspace = true }

[dependencies]
ulo = { workspace = true }
ftml-ontology = { workspace = true, features = ["rdf", "serde"] }
ftml-uris = { workspace = true, features = ["rdf", "serde"] }

flams-math-archives = { workspace = true, features = ["rdf"] }
flams-backend-types = { workspace = true }

flams-utils = { workspace = true, features = ["rayon", "async", "serde"] }
flams-git = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# tracing-appender = {workspace=true}
tracing-error = { workspace = true }
tempfile = { workspace = true }
triomphe = { workspace = true }
crossbeam-channel = { workspace = true }

inventory = { workspace = true }
rayon = { workspace = true }
spliter = { workspace = true }
walkdir = { workspace = true }
#regex = {workspace=true}
either = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
const_format = { workspace = true }
lazy_static = { workspace = true }
simple-home-dir = { workspace = true }
rustc-hash = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "io-util",
    "sync",
    "fs",
], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
chrono = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
git-url-parse = { workspace = true }

oxigraph = { workspace = true }
spargebra = { workspace = true }
sparesults = { workspace = true }
oxrdfio = { workspace = true }

serde = { workspace = true }
#bincode = { workspace = true }
eyre = { workspace = true }

#flate2 = {workspace=true,optional=true}
#tar = {workspace=true,optional=true}
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["stream"] }
async-compression = { workspace = true, optional = true }
astral-tokio-tar = { workspace = true, optional = true }

[lints]
workspace = true
