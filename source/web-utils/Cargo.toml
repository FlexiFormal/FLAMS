[package]
name = "flams-web-utils"
version = "0.0.1"
edition = "2021"

[lints]
workspace = true

[features]
ssr = [
    "leptos/ssr",
    "ftml-component-utils/ssr",
    "dep:tokio",
    "dep:http",
    "dep:leptos_axum",
    "ftml-components/ssr",
]
hydrate = [
    "leptos/hydrate",
    "ftml-component-utils/hydrate",
    "dep:gloo-storage",
    "getrandom/wasm_js",
    "ftml-components/hydrate",
]

[dependencies]

ftml-dom = { workspace = true }
ftml-components = { workspace = true }

flams-utils = { workspace = true, features = ["serde"] }

leptos-posthoc = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
ftml-component-utils = {workspace = true}
serde = { workspace = true }
gloo-storage = { workspace = true, optional = true }
send_wrapper = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }

tokio = { workspace = true, optional = true, features = ["rt"] }
http = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }

#tachys = {workspace = true}
#leptos_macro = {workspace = true}
#tachys = {version="=0.1.0-beta5"}
#reactive_graph = {version="=0.1.0-beta5"}
#leptos_macro = {version="=0.7.0-beta5"}
#hydration_context = {version="=0.2.0-beta5"}
#leptos_config = {version="=0.7.0-beta5"}
