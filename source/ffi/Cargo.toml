[package]
name = "flams-ffi"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ftml-ontology = { workspace = true, features = ["serde"] }
ftml-uris = { workspace = true, features = ["serde"] }

flams-math-archives = { workspace = true }
flams-system = { workspace = true }
flams-lsp = { workspace = true, features = ["ws"] }
flams-utils = { workspace = true, features = ["serde"] }
flams-stex = { workspace = true }

tracing-subscriber = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full", "rt", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2.170"


[lints]
workspace = true
